<!doctype html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2QJTEKK89H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-2QJTEKK89H");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bang's Tools - A collection of utilities including Vietnam Admin Data, Translation Workflow, and AI OCR." />
    <title>Bang's Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Outfit", sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-animate {
            animation: fadeIn 0.5s ease-out both;
        }

        .dark body { background-color: rgb(17 24 39); color: rgb(229 231 235); }
        .dark .bg-gray-50 { background-color: rgb(17 24 39); }
        .dark .bg-white\/80 { background-color: rgb(31 41 55 / 0.8); }
        .dark .text-gray-800 { color: rgb(229 231 235); }
        .dark .text-gray-900 { color: rgb(243 244 246); }
        .dark .text-gray-600 { color: rgb(156 163 175); }
        .dark .text-gray-500 { color: rgb(107 114 128); }
        .dark .border-white\/50 { border-color: rgb(55 65 81 / 0.5); }
    </style>
    <script>
        if (localStorage.getItem('bang-dark-mode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col relative overflow-x-hidden">
    <!-- Dynamic background -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none opacity-50">
        <div class="absolute top-[10%] left-[10%] w-[40%] h-[40%] rounded-full bg-sky-200/40 blur-[100px]"></div>
        <div class="absolute bottom-[20%] right-[10%] w-[30%] h-[30%] rounded-full bg-indigo-200/40 blur-[100px]"></div>
    </div>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-6xl">
        <header class="text-center mb-12 card-animate relative">
            <button id="dark-mode-btn"
                class="absolute right-0 top-0 p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                aria-label="Toggle dark mode">
            </button>
            <h1 class="text-5xl font-extrabold mb-4 pb-2 tracking-tight bg-gradient-to-r from-sky-600 to-indigo-600 bg-clip-text text-transparent">
                Bang's Tools
            </h1>
            <p class="text-xl text-gray-500">A collection of utilities and dashboards.</p>
        </header>

        <!-- Search + Category Filters -->
        <div class="mb-8" style="animation: fadeIn 0.5s ease-out 0.15s both;">
            <div class="relative mb-4">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                <input id="search-input" type="text" placeholder="Search tools..."
                    class="w-full pl-11 pr-4 py-3 rounded-2xl bg-white/80 backdrop-blur-xl border border-white/50 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 text-gray-700 placeholder-gray-400 transition-all" />
            </div>
            <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-2"></div>
        </div>

        <!-- Tools Grid -->
        <div id="tools-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
            <!-- Cards injected by JS -->
        </div>

        <!-- No Results -->
        <div id="no-results" class="hidden col-span-full py-20 text-center text-gray-400">
            <i class="fa-solid fa-magnifying-glass text-5xl mb-4 block opacity-30"></i>
            <p class="text-lg">No tools found matching your search.</p>
            <button onclick="clearSearch()" class="mt-4 text-indigo-500 hover:text-indigo-700 text-sm font-medium transition-colors">Clear search</button>
        </div>
    </main>

    <footer class="text-center py-8 text-gray-500 text-sm relative z-10">
        <div>&copy; 2026 Bang's Tools. All rights reserved.</div>
        <div class="mt-2">
            Contact: <a href="mailto:bangndd@gmail.com" class="hover:text-gray-900 transition-colors font-medium">bangndd@gmail.com</a>
        </div>
    </footer>

    <script>
        const PALETTES = {
            blue:   { text: 'text-blue-600',   bg: 'bg-blue-50',   bgHover: 'group-hover:bg-blue-100',   textHover: 'group-hover:text-blue-600' },
            green:  { text: 'text-green-600',  bg: 'bg-green-50',  bgHover: 'group-hover:bg-green-100',  textHover: 'group-hover:text-green-600' },
            amber:  { text: 'text-amber-500',  bg: 'bg-amber-50',  bgHover: 'group-hover:bg-amber-100',  textHover: 'group-hover:text-amber-500' },
            purple: { text: 'text-purple-600', bg: 'bg-purple-50', bgHover: 'group-hover:bg-purple-100', textHover: 'group-hover:text-purple-600' },
            indigo: { text: 'text-indigo-600', bg: 'bg-indigo-50', bgHover: 'group-hover:bg-indigo-100', textHover: 'group-hover:text-indigo-600' },
            orange: { text: 'text-orange-600', bg: 'bg-orange-50', bgHover: 'group-hover:bg-orange-100', textHover: 'group-hover:text-orange-600' },
            cyan:   { text: 'text-cyan-600',   bg: 'bg-cyan-50',   bgHover: 'group-hover:bg-cyan-100',   textHover: 'group-hover:text-cyan-600' },
            pink:   { text: 'text-pink-600',   bg: 'bg-pink-50',   bgHover: 'group-hover:bg-pink-100',   textHover: 'group-hover:text-pink-600' },
            red:    { text: 'text-red-600',    bg: 'bg-red-50',    bgHover: 'group-hover:bg-red-100',    textHover: 'group-hover:text-red-600' },
            teal:   { text: 'text-teal-600',   bg: 'bg-teal-50',   bgHover: 'group-hover:bg-teal-100',   textHover: 'group-hover:text-teal-600' },
            violet: { text: 'text-violet-600', bg: 'bg-violet-50', bgHover: 'group-hover:bg-violet-100', textHover: 'group-hover:text-violet-600' },
            rose:   { text: 'text-rose-600',   bg: 'bg-rose-50',   bgHover: 'group-hover:bg-rose-100',   textHover: 'group-hover:text-rose-600' },
        };

        const CATEGORY_LABELS = {
            all: 'All', data: 'Data', utility: 'Utility', ai: 'AI',
            image: 'Image', pdf: 'PDF', guide: 'Guide',
        };

        let allTools = [];
        let activeCategory = 'all';
        let searchQuery = '';

        function renderCards() {
            const grid = document.getElementById('tools-grid');
            const noResults = document.getElementById('no-results');

            const filtered = allTools.filter(tool => {
                const matchesCategory = activeCategory === 'all' || tool.category === activeCategory;
                const q = searchQuery.toLowerCase();
                const matchesSearch = !q || tool.title.toLowerCase().includes(q) || tool.description.toLowerCase().includes(q);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = filtered.map((tool, i) => {
                const p = PALETTES[tool.color] || PALETTES.blue;
                return `
                    <a href="${tool.url}"
                        class="group block bg-white/80 backdrop-blur-xl rounded-2xl shadow-sm hover:shadow-xl border border-white/50 transition-all duration-300 transform hover:-translate-y-1 overflow-hidden p-6 card-animate"
                        style="animation-delay: ${(i * 0.07).toFixed(2)}s">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-2xl font-bold text-gray-900 ${p.textHover} transition-colors">${tool.title}</h2>
                            <div class="p-2 ${p.bg} rounded-lg ${p.bgHover} transition-colors flex-shrink-0">
                                <i class="${tool.icon} ${p.text} text-xl w-6 text-center"></i>
                            </div>
                        </div>
                        <p class="text-gray-600 leading-relaxed">${tool.description}</p>
                        <div class="mt-6 flex items-center ${p.text} font-medium">
                            <span>${tool.cta}</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function renderTabs() {
            const categories = ['all', ...new Set(allTools.map(t => t.category))];
            const tabs = document.getElementById('category-tabs');
            tabs.innerHTML = categories.map(cat => {
                const isActive = cat === activeCategory;
                const base = 'px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-all duration-200 cursor-pointer';
                const active = 'bg-indigo-600 text-white shadow-md';
                const inactive = 'bg-white/80 text-gray-600 hover:bg-white border border-white/50';
                return `<button class="${base} ${isActive ? active : inactive}" data-category="${cat}">${CATEGORY_LABELS[cat] || cat}</button>`;
            }).join('');

            tabs.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCategory = btn.dataset.category;
                    renderTabs();
                    renderCards();
                });
            });
        }

        function clearSearch() {
            searchQuery = '';
            document.getElementById('search-input').value = '';
            renderCards();
        }

        // ── Dark mode ─────────────────────────────────────────────────────────
        function isDark() { return document.documentElement.classList.contains('dark'); }

        function updateDarkIcon() {
            const btn = document.getElementById('dark-mode-btn');
            if (!btn) return;
            btn.innerHTML = isDark()
                ? '<i class="fa-solid fa-sun text-amber-400"></i>'
                : '<i class="fa-solid fa-moon text-gray-500"></i>';
        }

        document.getElementById('dark-mode-btn').addEventListener('click', () => {
            const nowDark = !isDark();
            document.documentElement.classList.toggle('dark', nowDark);
            localStorage.setItem('bang-dark-mode', String(nowDark));
            updateDarkIcon();
        });

        updateDarkIcon();

        // ── Tools ─────────────────────────────────────────────────────────────
        async function init() {
            try {
                const res = await fetch('tools-manifest.json');
                allTools = await res.json();
            } catch {
                document.getElementById('tools-grid').innerHTML =
                    '<p class="col-span-full text-center text-red-500 py-12">Failed to load tools. Please refresh the page.</p>';
                return;
            }

            renderTabs();
            renderCards();

            document.getElementById('search-input').addEventListener('input', e => {
                searchQuery = e.target.value;
                renderCards();
            });
        }

        init();
    </script>
</body>

</html>
