<!doctype html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2QJTEKK89H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag("js", new Date());
        gtag("config", "G-2QJTEKK89H");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Models Directory | Bang's Tools</title>

    <!-- Meta -->
    <meta name="description" content="Explore, filter, and discover open-weight and hosted Large Language Models." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Outfit", sans-serif;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .dark body { background-color: rgb(17 24 39); color: rgb(229 231 235); }
        .dark .bg-gray-50 { background-color: rgb(17 24 39); }
        .dark .bg-white\/80 { background-color: rgb(31 41 55 / 0.8); }
        .dark .bg-white { background-color: rgb(31 41 55); }
        .dark .text-gray-800 { color: rgb(229 231 235); }
        .dark .text-gray-900 { color: rgb(243 244 246); }
        .dark .text-gray-700 { color: rgb(209 213 219); }
        .dark .text-gray-600 { color: rgb(156 163 175); }
        .dark .text-gray-500 { color: rgb(107 114 128); }
        .dark .border-gray-200 { border-color: rgb(55 65 81); }
        .dark .border-gray-100 { border-color: rgb(55 65 81); }
        .dark .border-white\/50 { border-color: rgb(55 65 81 / 0.5); }
        .dark .bg-gray-100 { background-color: rgb(55 65 81); }
    </style>
    <script>
        if (localStorage.getItem('bang-dark-mode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen relative overflow-x-hidden">
    <!-- Dynamic background -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none opacity-50">
        <div class="absolute top-[10%] left-[10%] w-[40%] h-[40%] rounded-full bg-teal-200/40 blur-[100px]"></div>
        <div class="absolute bottom-[20%] right-[10%] w-[30%] h-[30%] rounded-full bg-indigo-200/40 blur-[100px]"></div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto max-w-7xl p-6 my-8 animate-[fadeIn_0.5s_ease-out]">
        <!-- Header -->
        <div class="mb-6 flex flex-wrap gap-4 justify-between items-center bg-white/80 backdrop-blur-xl border border-white/50 rounded-2xl p-4 shadow-sm sticky top-4 z-50">
            <a href="index.html" class="inline-flex items-center text-gray-500 hover:text-teal-600 transition-colors font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Home
            </a>
            <div class="flex items-center gap-3 shrink-0">
                <h1 class="text-xl font-bold bg-gradient-to-r from-teal-600 to-indigo-600 bg-clip-text text-transparent hidden sm:block">
                    AI Models Directory
                </h1>
            </div>
            <button id="dark-mode-btn" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle dark mode">
                <!-- Icon injected by JS -->
            </button>
        </div>

        <div class="flex flex-col lg:flex-row gap-8 mt-8">
            <!-- Sidebar Filters -->
            <aside class="w-full lg:w-1/4 shrink-0">
                <div class="bg-white/80 backdrop-blur-xl border border-white/50 rounded-2xl p-6 shadow-sm sticky top-28">
                    <h3 class="font-bold text-lg mb-4 text-gray-900 border-b border-gray-100 pb-2">Filters</h3>
                    
                    <!-- Search -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="Model name..."
                                class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500/20 transition-all text-sm" />
                            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400"></i>
                        </div>
                    </div>

                    <!-- Provider Filter -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Provider</label>
                        <div id="providerFilters" class="space-y-2 max-h-48 overflow-y-auto pr-2 scrollbar-hide text-sm">
                            <!-- Checkboxes injected by JS -->
                        </div>
                    </div>

                    <!-- Open Source Filter -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">License</label>
                        <div class="space-y-2 text-sm">
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="checkbox" value="true" class="license-checkbox rounded border-gray-300 text-teal-600 focus:ring-teal-500 bg-white" />
                                <span class="text-gray-600 group-hover:text-gray-900">Open Source / Weights</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <input type="checkbox" value="false" class="license-checkbox rounded border-gray-300 text-teal-600 focus:ring-teal-500 bg-white" />
                                <span class="text-gray-600 group-hover:text-gray-900">Proprietary</span>
                            </label>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main List -->
            <div class="w-full lg:w-3/4">
                <div class="bg-white/80 backdrop-blur-xl border border-white/50 rounded-2xl shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50/50 border-b border-gray-200 text-gray-500 text-sm uppercase tracking-wider">
                                    <th class="p-4 font-semibold w-1/3">Model</th>
                                    <th class="p-4 font-semibold">Parameters</th>
                                    <th class="p-4 font-semibold">Context</th>
                                    <th class="p-4 font-semibold">LoRA</th>
                                    <th class="p-4 font-semibold text-right">License</th>
                                </tr>
                            </thead>
                            <tbody id="modelsList" class="divide-y divide-gray-100">
                                <!-- Rows injected by JS -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- No Results -->
                    <div id="noResults" class="hidden text-center py-20">
                        <i class="fa-solid fa-robot text-4xl text-gray-300 mb-4 block"></i>
                        <h3 class="text-lg font-semibold text-gray-700 mb-1">No models found</h3>
                        <p class="text-gray-500 text-sm">Try adjusting your filters or search query.</p>
                        <button id="clearFiltersBtn" class="mt-4 px-4 py-2 bg-teal-50 text-teal-600 rounded-lg text-sm font-medium hover:bg-teal-100 transition-colors">Clear all filters</button>
                    </div>
                </div>
                
                <div class="mt-4 text-sm text-gray-500 flex justify-between px-2">
                    <span id="modelCount">Loading models...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-gray-500 text-sm relative z-10">
        <div>&copy; 2026 Bang's Tools. All rights reserved.</div>
    </footer>

    <!-- Logic -->
    <script src="models.js"></script>
</body>

</html>
