<!doctype html>
<!--
    BANG'S TOOLS — New Tool Template
    ─────────────────────────────────
    How to use:
    1. Copy this file to the right location (root or a category sub-folder).
    2. Update <title>, <meta name="description">, and the <h1> + <p> in the hero section.
    3. Add your tool-specific HTML inside the <!-- TOOL CONTENT --> section.
4. Add any CDN libraries you need in <head> (after Tailwind).
    5. Write your tool logic in the <script> block at the bottom.
    6. Add an entry to /tools-manifest.json so it appears on the index page.

    Accent colour: change ACCENT_COLOR below to any Tailwind color name
    (blue | green | amber | indigo | pink | red | teal).
-->
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2QJTEKK89H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag("js", new Date());
        gtag("config", "G-2QJTEKK89H");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: update description -->
    <meta name="description" content="Tool description here." />
    <!-- TODO: update title (format: "Tool Name - Bang's Tools") -->
    <title>My Tool - Bang's Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- TODO: add any extra CDN libraries here -->
    <style>
        body { font-family: "Inter", sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: "Outfit", sans-serif; }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Dynamic background blobs — change colours to match your accent -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none opacity-40">
        <div class="absolute top-[10%] left-[10%] w-[40%] h-[40%] rounded-full bg-indigo-200/40 blur-[100px]"></div>
        <div class="absolute bottom-[20%] right-[10%] w-[30%] h-[30%] rounded-full bg-sky-200/40 blur-[100px]"></div>
    </div>

    <!-- ── Navigation (injected by nav.js, configured via data-nav-* on <body>) ── -->
    <!-- To change the back link: <body data-nav-back="/image_tools/" data-nav-back-label="Image Tools"> -->

    <main class="flex-grow container mx-auto px-4 py-10 max-w-5xl">

        <!-- ── Hero ── -->
        <header class="text-center mb-10">
            <!-- TODO: update icon class and color -->
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-2xl mb-4">
                <i class="fa-solid fa-wand-magic-sparkles text-3xl text-indigo-600"></i>
            </div>
            <!-- TODO: update heading and subtitle -->
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 mb-2">My Tool</h1>
            <p class="text-lg text-gray-500">One-line description of what this tool does.</p>
        </header>

        <!-- ── TOOL CONTENT ── -->
        <!-- Drop zone (remove if the tool doesn't accept file uploads) -->
        <section class="bg-white/80 backdrop-blur-xl rounded-3xl border border-white/50 shadow-sm p-8 mb-6">
            <div id="drop-zone" class="border-2 border-dashed border-gray-200 rounded-2xl p-10 text-center cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/30 transition-all">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-300 mb-3 block"></i>
                <p class="text-gray-500 mb-3">Drag & drop your file here, or</p>
                <button class="px-5 py-2 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700 transition-colors">
                    Browse File
                </button>
                <input id="file-input" type="file" accept=".xxx" class="hidden" />
            </div>

            <!-- File preview area (shown after file selection) -->
            <div id="file-preview" class="mt-4 hidden"></div>
        </section>

        <!-- Options / controls panel -->
        <section class="bg-white/80 backdrop-blur-xl rounded-3xl border border-white/50 shadow-sm p-8 mb-6 hidden" id="options-panel">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Options</h2>
            <!-- TODO: add your controls here -->
            <div class="flex flex-wrap gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Setting 1</label>
                    <select class="px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white">
                        <option>Option A</option>
                        <option>Option B</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button id="action-btn" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-play"></i>
                    Run
                </button>
                <button id="reset-btn" class="px-6 py-3 bg-gray-100 text-gray-600 font-semibold rounded-xl hover:bg-gray-200 transition-colors">
                    Reset
                </button>
            </div>
        </section>

        <!-- Results panel -->
        <section class="bg-white/80 backdrop-blur-xl rounded-3xl border border-white/50 shadow-sm p-8 hidden" id="results-panel">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Result</h2>
            <div id="results-content"></div>
            <div class="mt-4 flex gap-3">
                <button id="download-btn" class="px-5 py-2 bg-green-600 text-white text-sm font-medium rounded-xl hover:bg-green-700 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    Download
                </button>
            </div>
        </section>

    </main>

    <footer class="text-center py-8 text-gray-500 text-sm relative z-10">
        <div>&copy; 2026 Bang's Tools. All rights reserved.</div>
        <div class="mt-2">
            Contact: <a href="mailto:bangndd@gmail.com" class="hover:text-gray-900 transition-colors font-medium">bangndd@gmail.com</a>
        </div>
    </footer>

    <!-- Shared utilities (must be first) -->
    <script src="/js/utils/common.js"></script>
    <!-- Nav bar + dark mode toggle (injected automatically) -->
    <script src="/js/utils/nav.js"></script>
    <!-- TODO: add tool-specific utils below, e.g.:
        <script src="utils/pdf-libs.js"></script>
        <script src="utils/ui-manager.js"></script>
    -->

    <script>
        // ── Constants ──────────────────────────────────────────────────────────
        // const ACCENT_COLOR = 'indigo'; // matches the nav/button color above

        // ── Init ───────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            const { UIManager } = window.BangUtils;

            UIManager.setupDropZone('drop-zone', 'file-input', handleFiles, 'indigo');

            document.getElementById('action-btn').addEventListener('click', runTool);
            document.getElementById('reset-btn').addEventListener('click', reset);
        });

        // ── Handlers ───────────────────────────────────────────────────────────
        function handleFiles(files) {
            // TODO: validate and preview uploaded files
            const preview = document.getElementById('file-preview');
            const { UIManager, formatBytes } = window.BangUtils;
            UIManager.renderFilePreview(files, preview, 'fa-solid fa-file', 'text-indigo-500');
            preview.classList.remove('hidden');
            document.getElementById('options-panel').classList.remove('hidden');
        }

        async function runTool() {
            const { UIManager } = window.BangUtils;
            UIManager.showLoading('Processing...', 'indigo');
            try {
                // TODO: implement tool logic
                await new Promise(r => setTimeout(r, 500)); // remove placeholder
                UIManager.hideLoading();
                UIManager.showToast('Done!', 'success');
                document.getElementById('results-panel').classList.remove('hidden');
            } catch (err) {
                UIManager.hideLoading();
                UIManager.showToast(err.message || 'Something went wrong.', 'error');
            }
        }

        function reset() {
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview').innerHTML = '';
            document.getElementById('file-preview').classList.add('hidden');
            document.getElementById('options-panel').classList.add('hidden');
            document.getElementById('results-panel').classList.add('hidden');
        }
    </script>
</body>

</html>
